name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve? Why do you need it?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work? What would the user experience look like?
      placeholder: "It would be great if the extension could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've thought about?

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Setup / Installation
        - Sidebar UI
        - Hook Management
        - Langfuse Dashboard
        - Claude Integration
        - Copilot Chat Integration
        - New Backend (not Langfuse)
        - Documentation
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links, or any other context.
